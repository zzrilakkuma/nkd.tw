# Hostinger VPS 正式環境：Caddy（HTTPS）+ 前端 + FastAPI + PostgreSQL
# 使用方式（在 deploy/ 目錄下）：
#   cp .env.example .env && 填入實際值
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  caddy:
    image: caddy:2-alpine
    container_name: hookah-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      # 預演時可在 .env 設 CADDYFILE=./Caddyfile.api-only，只開放 API 網域
      - ${CADDYFILE:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

  web:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        # 編譯進前端 bundle，改了要重新 build
        REACT_APP_API_URL: https://${API_DOMAIN}/api/v1
    container_name: hookah-web
    restart: unless-stopped
    environment:
      PORT: "3000"
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: hookah-api
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8000"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      FRONTEND_URL: https://${SITE_DOMAIN},https://www.${SITE_DOMAIN}
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    # 需與來源資料庫的 major 版本一致或更新（Zeabur 為 18），pg_restore 才不會踩到相容問題
    image: postgres:${POSTGRES_VERSION:-18}
    container_name: hookah-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Asia/Taipei
    volumes:
      # PostgreSQL 18 起官方映像把資料放在 /var/lib/postgresql/<版本>/docker，
      # 所以掛載點是上層目錄；此設定僅適用 18 以上
      - postgres_data:/var/lib/postgresql
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # 只給內網用，不對外開 5432

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
